name: Dev to Main CI/CD

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack - Inicio
        if: env.SLACK_WEBHOOK_URL != ''
        run: |
          PAYLOAD=$(jq -n \
            --arg text "🚀 *Flujo Iniciado:* Construyendo y validando cambios de la rama \`dev\` en serprove-vet...
👤 *Autor:* ${{ github.actor }}
📝 *Commit:* ${{ github.event.head_commit.message }}" \
            '{text: $text}')
          curl -X POST -H 'Content-type: application/json' --data "$PAYLOAD" ${{ secrets.SLACK_WEBHOOK_URL }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Necesario para cambiar de rama y hacer merge
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Run Build (Check if everything is OK)
        run: npm run build

      - name: Merge dev into main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout main
          git merge origin/dev --no-edit
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Slack - Éxito
        if: success() && env.SLACK_WEBHOOK_URL != ''
        run: |
          PAYLOAD=$(jq -n \
            --arg text "✅ *Construcción Exitosa:* Los cambios de \`dev\` fueron aprobados y pasados a la rama \`main\`.
👤 *Autor:* ${{ github.actor }}
📝 *Commit:* ${{ github.event.head_commit.message }}" \
            '{text: $text}')
          curl -X POST -H 'Content-type: application/json' --data "$PAYLOAD" ${{ secrets.SLACK_WEBHOOK_URL }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify Slack - Fallo
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        run: |
          PAYLOAD=$(jq -n \
            --arg text "❌ *Error en la construcción:* Algo falló en la rama \`dev\`. No se pasaron los cambios a \`main\`.
👤 *Autor:* ${{ github.actor }}
📝 *Commit:* ${{ github.event.head_commit.message }}" \
            '{text: $text}')
          curl -X POST -H 'Content-type: application/json' --data "$PAYLOAD" ${{ secrets.SLACK_WEBHOOK_URL }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
